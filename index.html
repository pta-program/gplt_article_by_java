<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPLT Java 题解</title>
  <meta name="description" content="GPLT L1、L2、L3 Java 题解文档，共 225 道题目。">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gplt-theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.dataset.theme = 'dark';
      } catch (error) {
        // 隐私模式下无法访问 localStorage 时，继续使用默认主题。
      }
    }());
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <style>
    :root {
      --theme-color: #6d5dfc;
      --sidebar-width: 300px;
      --content-max-width: 1040px;
      --page-bg: #f7f8fc;
      --surface: #ffffff;
      --text: #25283a;
      --muted: #737890;
      --border: #e6e8f1;
      --code-bg: #f4f5fa;
      --code-text: #272a3b;
      --quote-bg: #f1f2fa;
      --sidebar-bg: #fbfbfe;
      --sidebar-hover: #eeecff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #11131d;
      --surface: #191c29;
      --text: #e6e8f2;
      --muted: #a4a9bd;
      --border: #2d3348;
      --code-bg: #111521;
      --code-text: #e3e7f2;
      --quote-bg: #222638;
      --sidebar-bg: #151824;
      --sidebar-hover: #302d58;
    }

    * { box-sizing: border-box; }

    html, body {
      background: var(--page-bg) !important;
      color: var(--text) !important;
    }

    body,
    .markdown-section,
    .markdown-section strong,
    .markdown-section em,
    .markdown-section p,
    .markdown-section li,
    .markdown-section table { color: var(--text); }

    .markdown-section { max-width: var(--content-max-width); }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 { color: var(--text); }

    .markdown-section a { color: #6a5acd; }
    html[data-theme="dark"] .markdown-section a { color: #a99dff; }

    .markdown-section blockquote {
      background: var(--quote-bg);
      border-left-color: #6a5acd;
    }

    .markdown-section code,
    .markdown-section pre > code {
      background: var(--code-bg);
      color: var(--code-text);
    }

    .markdown-section pre {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--code-bg);
      box-shadow: 0 8px 24px rgba(106, 90, 205, 0.06);
    }

    .markdown-section table { display: table; width: 100%; }
    .markdown-section tr { border-color: var(--border); }
    .markdown-section th { background: var(--sidebar-hover); }

    .sidebar {
      background: var(--sidebar-bg);
      border-right-color: var(--border);
      overflow-y: auto;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .content {
      transition: left .25s ease;
    }

    body.sidebar-collapsed .sidebar,
    html[data-sidebar-collapsed="true"] .sidebar {
      transform: translateX(-100%);
      box-shadow: none;
    }

    body.sidebar-collapsed .content,
    html[data-sidebar-collapsed="true"] .content {
      left: 0;
    }

    .sidebar-collapse-btn {
      position: fixed;
      top: 50%;
      left: calc(var(--sidebar-width) - 16px);
      z-index: 10000;
      width: 32px;
      height: 58px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 0 12px 12px 0;
      background: var(--surface);
      color: var(--muted);
      box-shadow: 4px 0 14px rgba(0, 0, 0, .12);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transform: translateY(-50%);
      transition: left .25s ease, background .2s ease, color .2s ease;
    }
    .sidebar-collapse-btn:hover {
      background: var(--sidebar-hover);
      color: var(--theme-color);
    }
    .sidebar-collapse-btn:focus-visible {
      outline: 3px solid rgba(106, 90, 205, .4);
      outline-offset: 2px;
    }
    body.sidebar-collapsed .sidebar-collapse-btn,
    html[data-sidebar-collapsed="true"] .sidebar-collapse-btn {
      left: 0;
      border-radius: 0 12px 12px 0;
    }

    .sidebar-nav { padding: 18px 14px 36px; }
    .sidebar-nav > ul > li > strong {
      display: block;
      margin: 18px 10px 8px;
      color: var(--text);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .sidebar-section-toggle {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 18px 0 4px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-align: left;
    }
    .sidebar-section-toggle::before {
      content: '▾';
      display: inline-block;
      width: 18px;
      color: var(--theme-color);
      transition: transform .2s ease;
    }
    .sidebar-section.is-collapsed > .sidebar-section-toggle::before {
      transform: rotate(-90deg);
    }
    .sidebar-section-toggle:hover,
    .sidebar-section-toggle:focus-visible {
      background: var(--sidebar-hover);
      color: var(--theme-color);
    }
    .sidebar-section-toggle:focus-visible {
      outline: 2px solid rgba(106, 90, 205, .4);
      outline-offset: 1px;
    }
    .sidebar-section.is-collapsed > ul { display: none; }

    .sidebar-topic {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    .sidebar-topic > .sidebar-topic-link {
      flex: 1 1 calc(100% - 28px);
      min-width: 0;
    }
    .sidebar-topic-toggle {
      flex: 0 0 24px;
      width: 24px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }
    .sidebar-topic-toggle::before { content: '▸'; }
    .sidebar-topic:not(.is-collapsed) > .sidebar-topic-toggle::before { content: '▾'; }
    .sidebar-topic-toggle:hover,
    .sidebar-topic-toggle:focus-visible {
      background: var(--sidebar-hover);
      color: var(--theme-color);
    }
    .sidebar-topic-toggle:focus-visible {
      outline: 2px solid rgba(106, 90, 205, .4);
      outline-offset: 1px;
    }
    .sidebar-topic > ul {
      flex: 0 0 100%;
      margin: 0 0 5px;
      padding-left: 0 !important;
      border-left: 1px solid var(--border);
    }
    .sidebar-topic.is-collapsed > ul { display: none; }
    .sidebar-heading a {
      padding: 3px 8px 3px 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .sidebar-heading-level-3 a,
    .sidebar-heading-level-4 a,
    .sidebar-heading-level-5 a,
    .sidebar-heading-level-6 a { padding-left: 34px; }
    .sidebar-heading a:hover { color: var(--theme-color); }
    .sidebar-nav li { margin: 0; }
    .sidebar-nav a {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      white-space: normal;
      overflow-wrap: anywhere;
      padding: 5px 10px;
      border-radius: 7px;
    }
    .sidebar-nav a:hover,
    .sidebar-nav .app-sub-sidebar li > a:hover {
      background: var(--sidebar-hover);
      color: var(--theme-color);
    }
    .sidebar-nav .app-sub-sidebar li > a { padding-left: 22px; }
    .sidebar-nav ul li ul { padding: 0; }

    .search .search input {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
    .search .search .search-keyword { color: var(--theme-color); }
    .search .search .search-keyword,
    .search .search .search-keyword:hover { background: var(--sidebar-hover); }

    .pagination-item a { color: var(--theme-color); }
    .docsify-pagination-container { border-color: var(--border); }

    .darklight-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      backdrop-filter: blur(12px);
    }
    .darklight-btn:hover {
      transform: translateY(-2px) rotate(8deg);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
    }
    .darklight-btn:focus-visible {
      outline: 3px solid rgba(106, 90, 205, .4);
      outline-offset: 3px;
    }

    @media (max-width: 768px) {
      :root { --sidebar-width: 300px; }
      .darklight-btn { right: 16px; bottom: 16px; }
      .sidebar-collapse-btn { left: calc(var(--sidebar-width) - 16px); }
    }

    @supports not (background: color-mix(in srgb, white 50%, transparent)) {
      .darklight-btn { background: var(--surface); }
    }
    /* 与 C++ 题解库保持一致的侧栏布局 */
    .sidebar {
      padding: 40px 0 32px;
      width: var(--sidebar-width);
    }
    .sidebar-nav {
      line-height: 2em;
      padding: 0 0 40px;
    }
    .sidebar-nav ul { margin: 0 0 0 15px; }
    .sidebar-nav > ul > li { margin: 6px 0; }
    .sidebar-nav > ul > li > strong {
      display: block;
      margin: 0;
      font-size: 14px;
      letter-spacing: .02em;
    }
    .sidebar-nav > ul > li > p {
      display: block;
      margin: 0;
      color: var(--text);
      font-weight: 700;
      letter-spacing: .02em;
    }
    .sidebar-nav a {
      border-radius: 0;
      font-size: 14px;
      line-height: inherit;
      padding: 0;
      transition: color .18s ease;
      white-space: nowrap;
    }
    .sidebar-nav a:hover {
      background: transparent;
      text-decoration: underline;
    }
    .sidebar-nav li.active > a {
      border-right: 2px solid var(--theme-color);
      font-weight: 650;
      text-decoration: none;
    }
    .sidebar-nav ul li ul { padding: 0; }
    .sidebar-nav .page-toc {
      border-left: 1px solid var(--border);
      margin: 2px 0 4px 8px;
      padding: 2px 0 2px 8px;
    }
    .sidebar-nav .page-toc > li { margin: 0; padding-left: 0; }
    .sidebar-nav .page-toc > li > a {
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.6;
      padding: 5px 9px;
      white-space: normal;
    }
    .sidebar-nav .page-toc > li[data-level="2"] > a { padding-left: 17px; }
    .sidebar-nav .page-toc > li[data-level="3"] > a { padding-left: 25px; }
    .sidebar-nav .page-toc > li[data-level="4"] > a { padding-left: 33px; }
    .sidebar-nav .page-toc > li[data-level="5"] > a { padding-left: 41px; }
    .sidebar-nav .page-toc > li[data-level="6"] > a { padding-left: 49px; }
    .sidebar-nav .page-toc > li > a:hover,
    .sidebar-nav .page-toc > li.active > a {
      background: var(--sidebar-hover);
      color: var(--theme-color);
      text-decoration: none;
    }
    .content {
      left: var(--sidebar-width);
      padding-top: 26px;
    }
  </style>
</head>
<body>
  <button class="darklight-btn" id="darklight-toggle" type="button" aria-label="切换暗黑模式" title="切换暗黑模式">🌙</button>
  <div id="app">正在加载文档…</div>

  <script>
    window.$docsify = {
      name: 'GPLT · Java 题解',
      repo: 'https://github.com/Zonkidd-Shao/gplt_article_by_java',
      homepage: 'README.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      sidebarDisplayLevel: 2,
      auto2top: true,
      relativePath: false,
      mergeNavbar: true,
      search: {
        placeholder: '🔍 搜索题号 / 标题 / 关键词',
        depth: 4,
        noData: '没有找到结果',
        paths: 'auto'
      },
      pagination: {
        previousText: '上一题',
        nextText: '下一题',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: { buttonText: '复制', errorText: '复制失败', successText: '已复制' },
      count: { countable: true, language: 'chinese' },
      themeColor: '#6d5dfc',
      notFoundPage: true,
      plugins: [function (hook, vm) {
        hook.doneEach(function () {
          document.querySelectorAll('.sidebar-nav .page-toc').forEach(function (toc) {
            toc.remove();
          });

          var activeLink = document.querySelector('.sidebar-nav li.active > a, .sidebar-nav li.active > p > a');
          if (!activeLink) return;
          var activeItem = activeLink.closest('li');
          var headings = Array.prototype.slice.call(document.querySelectorAll(
            '#main h1, #main h2, #main h3, #main h4, #main h5, #main h6'
          ));
          if (!headings.length) return;

          var toc = document.createElement('ul');
          toc.className = 'app-sub-sidebar page-toc';
          headings.forEach(function (heading) {
            var item = document.createElement('li');
            var link = document.createElement('a');
            link.className = 'section-link';
            item.dataset.level = heading.tagName.substring(1);
            link.textContent = heading.textContent;
            link.href = vm.router.toURL(vm.router.getCurrentPath(), { id: heading.id });
            item.appendChild(link);
            toc.appendChild(item);
          });
          activeItem.appendChild(toc);
        });
      }]
    };

    (function () {
      var button = document.getElementById('darklight-toggle');
      var root = document.documentElement;

      function isDark() { return root.dataset.theme === 'dark'; }
      function updateButton() {
        var dark = isDark();
        button.textContent = dark ? '☀️' : '🌙';
        button.title = dark ? '切换浅色模式' : '切换暗黑模式';
        button.setAttribute('aria-label', button.title);
      }
      function setTheme(dark, remember) {
        root.dataset.theme = dark ? 'dark' : 'light';
        if (remember) {
          try { localStorage.setItem('gplt-theme', dark ? 'dark' : 'light'); } catch (error) {}
        }
        updateButton();
      }

      button.addEventListener('click', function () { setTheme(!isDark(), true); });
      document.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'd') {
          event.preventDefault();
          setTheme(!isDark(), true);
        }
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (event) {
        try {
          if (!localStorage.getItem('gplt-theme')) setTheme(event.matches, false);
        } catch (error) {}
      });
      updateButton();
    }());

  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/countable@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
